# hypha, split deployment: nginx serves the panel (mycelium), hyphad serves the API.
#
#   browser ──► nginx :5522 ──┬─► /var/www/mycelium   (static, React build)
#                             └─► 127.0.0.1:5599      (hyphad: /api, /agent, /install.sh, /dl)
#
# Port split matters: hyphad binds a loopback port that nobody outside reaches,
# nginx owns the public one. Keep `public_url` in /etc/hypha/hub.json pointing at
# the *public* address (the one nginx listens on) — install commands are built
# from it, and agents dial it back.
#
#   /etc/hypha/hub.json:  { "listen": "127.0.0.1:5599",
#                           "public_url": "https://hub.example.com", ... }
#
# TLS: this file is plain HTTP. For anything beyond a private network, terminate
# TLS here (or in front) and keep hyphad on loopback. The hub has no
# authentication — anyone who can reach it can run commands as root on every
# enrolled host.

server {
    listen 5522;
    server_name _;

    # React build output. `try_files` gives the SPA its client-side routes.
    root /var/www/mycelium;
    index index.html;

    client_max_body_size 1m;

    # --- agent rendezvous (WebSocket, long-lived) -------------------------
    location = /agent {
        proxy_pass http://127.0.0.1:5599;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- API, including SSE (/api/exec/{id}/events) and PTY (WS at /api/pty)
    location /api/ {
        proxy_pass http://127.0.0.1:5599;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE and PTY must stream. Buffering turns a live terminal into a
        # stutter and an exec stream into one big blob at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- installer endpoints stay on the hub ------------------------------
    # These are not panel routes: /dl/{name} streams a binary and /install.sh
    # is what a human pipes into `sudo sh` on a brand-new machine.
    location = /install.sh {
        proxy_pass http://127.0.0.1:5599;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dl/ {
        proxy_pass http://127.0.0.1:5599;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5599;
    }

    # --- panel ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # The panel is a static bundle; hashed assets can be cached hard, but
        # index.html must not be, or a deploy leaves browsers on the old shell
        # pointing at asset hashes that no longer exist.
        location = /index.html {
            add_header Cache-Control "no-store";
        }
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Uncomment to put a real auth boundary in front of an unauthenticated hub.
    # auth_basic "hypha";
    # auth_basic_user_file /etc/nginx/hypha.htpasswd;
}

# nginx < 1.25 has no $connection_upgrade; define it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
